{% extends "admin_base.html" %}
{% block title %}Products{% endblock %}
{% block content %}
<h1>Products</h1>
<a href="{{ url_for('admin_product_form') }}" class="checkout-btn">+ Naya Product</a>
<br><br>

<table class="admin-table">
    <tr>
        <th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th>
    </tr>
    {% for p in products %}
    <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.category.name }}</td>
        <td>₹{{ p.price }}</td>
        <td>{{ p.stock }}</td>
        <td>
            <a href="{{ url_for('admin_product_form', product_id=p.id) }}">Edit</a>

            <form class="inline-form"
                  action="{{ url_for('admin_delete_product', product_id=p.id) }}"
                  method="POST"
                  onsubmit="return confirm('Pakka delete karna hai?');">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
