<style>
    #chat-fab {
        position: fixed; right: 20px; bottom: 20px; z-index: 1000;
        padding: 14px 20px; border: none; border-radius: 30px;
        background: #111; color: #fff; font-size: 16px; cursor: pointer;
        box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    #chat-box {
        display: none; flex-direction: column;
        position: fixed; right: 20px; bottom: 80px; z-index: 1000;
        width: 340px; max-width: calc(100vw - 40px); height: 470px;
        background: #fff; border-radius: 14px; overflow: hidden;
        box-shadow: 0 6px 24px rgba(0,0,0,0.3);
    }
    .chat-head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 16px; background: #111; color: #fff; font-weight: bold;
    }
    .chat-head span { cursor: pointer; }
    #chat-log { flex: 1; overflow-y: auto; padding: 12px; background: #f6f6f6; }
    .msg { max-width: 85%; margin-bottom: 8px; padding: 8px 12px;
           border-radius: 12px; font-size: 14px; line-height: 1.4; }
    .msg.bot  { background: #fff; border: 1px solid #ddd; }
    .msg.user { background: #111; color: #fff; margin-left: auto; }
    .chat-product {
        display: block; margin: 0 0 6px; padding: 8px 12px; font-size: 13px;
        background: #e8f5e9; border-radius: 8px; color: #111; text-decoration: none;
    }
    .chat-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; }
    .chat-chip {
        border: 1px solid #ccc; background: #fff; border-radius: 14px;
        padding: 4px 10px; font-size: 12px; cursor: pointer;
    }
    #chat-form { display: flex; border-top: 1px solid #ddd; }
    #chat-input { flex: 1; padding: 12px; border: none; outline: none; font-size: 14px; }
    #chat-form button { padding: 0 16px; border: none; background: #111; color: #fff; cursor: pointer; }
</style>

<button id="chat-fab" type="button" onclick="toggleChat()">🤖 Ask AI</button>

<div id="chat-box">
    <div class="chat-head">
        🤖 AI Basket Assistant
        <span onclick="toggleChat()">✕</span>
    </div>

    <div id="chat-log"></div>

    <div class="chat-chips">
        <button type="button" class="chat-chip" data-q="500 me one week ka rasan">500 me rasan</button>
        <button type="button" class="chat-chip" data-q="sabse sasta dal">Sasta dal</button>
        <button type="button" class="chat-chip" data-q="popular products">Popular</button>
    </div>

    <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Kuch pucho..." autocomplete="off" maxlength="300">
        <button type="submit">Send</button>
    </form>
</div>

<script>
    const ASK_URL = "{{ url_for('ask_ai') }}";
    const PRODUCTS_URL = "{{ url_for('products') }}";
    const CSRF_TOKEN = "{{ csrf_token() }}";

    const chatBox = document.getElementById("chat-box");
    const chatLog = document.getElementById("chat-log");
    const chatInput = document.getElementById("chat-input");
    let greeted = false;

    function openChat() {
        chatBox.style.display = "flex";
        if (!greeted) {
            addBot("Welcome! 👋 Budget, rate ya product pucho. Jaise: '500 me one week ka rasan'.", []);
            greeted = true;
        }
        chatInput.focus();
    }

    function toggleChat() {
        if (chatBox.style.display === "flex") {
            chatBox.style.display = "none";
        } else {
            openChat();
        }
    }

    function addMsg(text, who) {
        const d = document.createElement("div");
        d.className = "msg " + who;
        d.textContent = text;
        chatLog.appendChild(d);
        chatLog.scrollTop = chatLog.scrollHeight;
        return d;
    }

    function addBot(text, products) {
        addMsg(text, "bot");
        products.forEach(function (p) {
            const a = document.createElement("a");
            a.className = "chat-product";
            a.href = PRODUCTS_URL + "?q=" + encodeURIComponent(p.name);
            a.textContent = p.name + " — ₹" + p.price.toFixed(2) + (p.stock > 0 ? "" : " (out of stock)");
            chatLog.appendChild(a);
        });
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function sendMessage(text) {
        addMsg(text, "user");
        const wait = addMsg("Soch raha hu...", "bot");
        try {
            const res = await fetch(ASK_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": CSRF_TOKEN
                },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            wait.remove();
            addBot(data.reply, data.products || []);
        } catch (err) {
            wait.textContent = "Network error, dobara try karo.";
        }
    }

    document.getElementById("chat-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const t = chatInput.value.trim();
        if (!t) return;
        chatInput.value = "";
        sendMessage(t);
    });

    document.querySelectorAll(".chat-chip").forEach(function (chip) {
        chip.addEventListener("click", function () { sendMessage(chip.dataset.q); });
    });
</script>
