{% extends "admin_base.html" %}
{% block title %}{{ 'Edit' if product else 'Add' }} Product{% endblock %}
{% block content %}
<h1>{{ 'Product Edit Karo' if product else 'Naya Product' }}</h1>

<form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <input type="text" name="name" placeholder="Product name"
           value="{{ product.name if product else '' }}" required><br><br>

    <select name="category_id" required>
        <option value="">Category chuno</option>
        {% for c in categories %}
            <option value="{{ c.id }}"
                {% if product and product.category_id == c.id %}selected{% endif %}>
                {{ c.name }}
            </option>
        {% endfor %}
    </select><br><br>

    <input type="number" step="0.01" min="0" name="price" placeholder="Price"
           value="{{ product.price if product else '' }}" required><br><br>

    <input type="number" min="0" name="stock" placeholder="Stock"
           value="{{ product.stock if product else '' }}" required><br><br>

    <textarea name="description" rows="3" cols="40"
              placeholder="Description">{{ product.description if product and product.description else '' }}</textarea><br><br>

    {% if product and product.image %}
        <p>Abhi ki image:</p>
        <img src="{{ url_for('static', filename='images/' + product.image) }}"
             alt="{{ product.name }}" style="max-width:140px; border-radius:8px;"><br>
        <label><input type="checkbox" name="remove_image" value="1"> Ye image hata do</label><br><br>
    {% endif %}

    <label>{{ 'Nayi image (purani badal jayegi)' if product and product.image else 'Product image' }}
        (JPG, PNG ya WEBP, max 2 MB):</label><br>
    <input type="file" name="image_file" accept="image/png,image/jpeg,image/webp"><br><br>

    <button type="submit" class="checkout-btn">Save</button>
</form>
{% endblock %}
